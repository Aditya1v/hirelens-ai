services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/hirelens
      - CLIENT_ORIGIN=http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
